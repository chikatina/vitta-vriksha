<!DOCTYPE html>
<html lang="en" data-appearance="light" data-accent="jade">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Vitta Vriksha</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vitta Vriksha">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0B1120">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-bar" id="appBar">
    <button class="icon-button hidden" id="backButton" aria-label="Back"></button>
    <h1 class="app-bar-title" id="appBarTitle">Home</h1>
    <button class="icon-button" id="lockButton" aria-label="Lock the app"></button>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <button class="fab" id="fab"><span id="fabLabel">Add</span></button>

  <nav class="nav-bar" id="navBar" aria-label="Sections"></nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && !window.AndroidBridge) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update().catch(() => {});
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
